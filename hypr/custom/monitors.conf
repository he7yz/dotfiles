# Clean up any automatic layout rules made by hyprmon
monitor = , preferred, auto, 1, delrebuilt

# Map the layout explicitly from left to right
monitor = HDMI-A-1, 1920x1080@60, 0x0, 1
monitor = eDP-2, 2560x1600@120, 1920x0, 1

# Explicitly pin workspaces to avoid automated shuffling
workspace = 1, monitor:HDMI-A-1, default:true
workspace = 2, monitor:eDP-2, default:true

